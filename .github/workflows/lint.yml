name: Historical Source Syntax

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile without imports
        run: python -m compileall -q scripts src tests
      - name: Explain scope
        run: echo "Formatting is not retroactively imposed on preserved historical source." >> "$GITHUB_STEP_SUMMARY"
