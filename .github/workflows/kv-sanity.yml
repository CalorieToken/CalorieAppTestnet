name: KV Sanity (Archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-check:
    name: Preserve KV evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify historical inputs remain present
        shell: bash
        run: |
          test -f scripts/kv_sanity_check.py
          test -d src/core/kv
      - name: Explain scope
        run: echo "The dependency-bound runtime KV test is archived and is not a supported build claim." >> "$GITHUB_STEP_SUMMARY"
