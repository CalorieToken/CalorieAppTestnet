name: UX Tour (Archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-check:
    name: Preserve UX-tour evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Verify historical tour material remains present
        shell: bash
        run: |
          test -f scripts/ux_tour.py
          test -d docs/ui_tour
      - name: Explain scope
        run: echo "The UX tour is historical evidence, not an active supported product test." >> "$GITHUB_STEP_SUMMARY"
