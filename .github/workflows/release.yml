name: Release (Archived)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived:
    name: Publication disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain release boundary
        run: |
          echo "Automated publication is disabled for this inactive historical Testnet repository." >> "$GITHUB_STEP_SUMMARY"
          echo "A new release requires explicit owner approval plus fresh dependency, security, IP, and regulatory review." >> "$GITHUB_STEP_SUMMARY"
