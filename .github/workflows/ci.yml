name: Historical Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Legal boundaries and Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Enforce legal and licensing boundaries
        run: python scripts/check_legal_boundaries.py
      - name: Compile Python source without importing historical dependencies
        run: python -m compileall -q scripts src tests
      - name: Record archival boundary
        run: |
          echo "This repository is an inactive historical Testnet prototype." >> "$GITHUB_STEP_SUMMARY"
          echo "Runtime installation and release tests are intentionally not claimed." >> "$GITHUB_STEP_SUMMARY"
